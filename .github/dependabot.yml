version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 15
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      # Minor and patch land together; a base-image major gets its own PR.
      docker-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: daily
    cooldown:
      default-days: 15
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]