name: Build

on:
  pull_request:
  push:
    branches: ['master']
  workflow_dispatch:

permissions: {}

# Supersede in-flight PR builds, but let master runs finish
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PUBLISH: ${{ github.ref == 'refs/heads/master' }}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download actionlint
        run: docker build --tag actionlint - < .github/workflows/actionlint.dockerfile

      - name: Run actionlint to check workflow files
        run: docker run --volume="${PWD}:/repo" --workdir=/repo actionlint -color

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm

      - name: Install the formatter
        run: npm ci

      - name: Check formatting
        run: npm run check

  build:
    strategy:
      fail-fast: false
      matrix:
        # The Dockerfile targets
        target: [gdal, pdal]
        # linux/arm64 also needs linux-aarch64 in pixi.toml's platforms
        platform: [linux/amd64]
        include:
          # Where each target is published (also in the publish job)
          - target: gdal
            image: ghcr.io/linz/li-gdal-docker
          - target: pdal
            image: ghcr.io/linz/li-pdal-docker
          - platform: linux/amd64
            runner: ubuntu-latest
          # - platform: linux/arm64
          #   runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          load: true
          tags: ${{ matrix.target }}:ci
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.platform }}
          cache-to: ${{ github.ref == 'refs/heads/master' && format('type=gha,mode=max,scope={0}-{1}', matrix.target, matrix.platform) || '' }}

      # The version comes from pixi.lock, so read it from the built image rather than repeating it
      - name: Read the version the image will be tagged with
        id: version
        env:
          TARGET: ${{ matrix.target }}
        run: |
          case "$TARGET" in
            gdal)
              reported="$(docker run --rm --network none gdal:ci gdalinfo --version)"
              pattern='^GDAL ([0-9]+\.[0-9]+\.[0-9]+)[ ,]'
              ;;
            pdal)
              reported="$(docker run --rm --network none pdal:ci pdal --version)"
              pattern='pdal ([0-9]+\.[0-9]+\.[0-9]+) '
              ;;
            *)
              echo "::error::no version check for target ${TARGET}"
              exit 1
              ;;
          esac
          reported="${reported//$'\r'/}"
          echo "${reported}"
          docker run --rm --network none "${TARGET}:ci" python --version
          if [[ ! "$reported" =~ $pattern ]]; then
            echo "::error::could not read the ${TARGET} version from the image"
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed without a tag so each platform can be collected into one manifest list below.
      # The layers are already in the builder cache, so this does not rebuild.
      - name: Push by digest
        id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.platform }}
          provenance: false
          sbom: false
          outputs: type=image,name=${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true

      - name: Write the digest and version to files
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::the push step did not report a sha256 digest: '${DIGEST}'"
            exit 1
          fi
          mkdir -p /tmp/build/digests
          touch "/tmp/build/digests/${DIGEST#sha256:}"
          echo "${VERSION}" > /tmp/build/version

      - name: Upload the digest and version
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.target }}-${{ strategy.job-index }}
          path: /tmp/build/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: github.ref == 'refs/heads/master'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Where each target is published (also in the build job)
          - target: gdal
            image: ghcr.io/linz/li-gdal-docker
          - target: pdal
            image: ghcr.io/linz/li-pdal-docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write
    steps:
      - name: Download the digests and version
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/build
          pattern: digest-${{ matrix.target }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the digests as one image
        id: tag
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          version="$(cat /tmp/build/version)"
          if [[ ! "$version" =~ ^[0-9A-Za-z][0-9A-Za-z.+_-]*$ ]]; then
            echo "::error::the build job did not report a usable version: '${version}'"
            exit 1
          fi
          shopt -s nullglob
          refs=()
          for digest in /tmp/build/digests/*; do refs+=("${IMAGE}@sha256:$(basename "$digest")"); done
          if (( ${#refs[@]} == 0 )); then
            echo "::error::no digests were downloaded from the build job"
            exit 1
          fi
          docker buildx imagetools create \
            --tag "${IMAGE}:${version}" \
            --tag "${IMAGE}:${version}-${GITHUB_SHA::7}" \
            "${refs[@]}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Report the reference to pin
        env:
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          digest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{ .Manifest.Digest }}')"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::warning::could not read the manifest digest, skipping the pin hint"
            exit 0
          fi
          {
            echo "Pin this image with:"
            echo '```'
            echo "${IMAGE}:${VERSION}@${digest}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  ci-ok:
    if: always()
    needs: [lint, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
