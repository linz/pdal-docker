name: Build

on:
  pull_request:
  push:
    branches: ['master']
  workflow_dispatch:

permissions: {}

# Supersede in-flight PR builds, but let master runs finish
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PUBLISH: ${{ github.ref == 'refs/heads/master' }}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download actionlint
        run: docker build --tag actionlint - < .github/workflows/actionlint.dockerfile

      - name: Run actionlint to check workflow files
        run: docker run --volume="${PWD}:/repo" --workdir=/repo actionlint -color

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm

      - name: Install the formatter
        run: npm ci

      - name: Check formatting
        run: npm run check

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          # - platform: linux/arm64
          #   runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.pdal.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the PDAL version from the recipe
        id: pdal
        run: |
          version="$(awk '/^ARG PDAL_VERSION=/ { sub(/^ARG PDAL_VERSION=/, ""); gsub(/[" ]/, ""); print; exit }' Dockerfile)"
          if [[ ! "$version" =~ ^[0-9A-Za-z][0-9A-Za-z.+_-]*$ ]]; then
            echo "::error::PDAL_VERSION is missing from the Dockerfile or is not a plain version string: '${version}'"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: pdal:ci
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: ${{ github.ref == 'refs/heads/master' && format('type=gha,mode=max,scope={0}', matrix.platform) || '' }}

      - name: Verify the image is the version it will be tagged with
        env:
          VERSION: ${{ steps.pdal.outputs.version }}
        run: |
          labelled="$(docker inspect --format '{{ index .Config.Labels "nz.govt.linz.pdal.version" }}' pdal:ci)"
          reported="$(docker run --rm --network none --entrypoint pdal pdal:ci --version)"
          reported="${reported//$'\r'/}"
          echo "label=${labelled} tag=${VERSION}"
          echo "${reported}"
          if [[ "$labelled" != "$VERSION" ]]; then
            echo "::error::image label ${labelled} does not match the tag ${VERSION}"
            exit 1
          fi
          # -F: the version is a literal, not a regex. Unanchored `2.9.0` would match `2X9X0`.
          if ! grep -qF -- "pdal ${VERSION}" <<< "$reported"; then
            echo "::error::pdal reports a different version than ${VERSION}"
            exit 1
          fi

      - name: Login to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed without a tag so each platform can be collected into one manifest list below.
      # The layers are already in the builder cache, so this does not rebuild.
      - name: Push by digest
        id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          provenance: false
          sbom: false
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true

      - name: Write the digest to a file
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::the push step did not report a sha256 digest: '${DIGEST}'"
            exit 1
          fi
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write
    steps:
      - name: Download the digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the digests as one image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9A-Za-z][0-9A-Za-z.+_-]*$ ]]; then
            echo "::error::the build job did not report a usable PDAL version: '${VERSION}'"
            exit 1
          fi
          shopt -s nullglob
          refs=()
          for digest in /tmp/digests/*; do refs+=("${IMAGE}@sha256:$(basename "$digest")"); done
          if (( ${#refs[@]} == 0 )); then
            echo "::error::no digests were downloaded from the build job"
            exit 1
          fi
          docker buildx imagetools create \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:${VERSION}-${GITHUB_SHA::7}" \
            "${refs[@]}"

      - name: Report the reference to pin
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          digest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{ .Manifest.Digest }}')"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::warning::could not read the manifest digest, skipping the pin hint"
            exit 0
          fi
          {
            echo "Pin this image with:"
            echo '```'
            echo "${IMAGE}:${VERSION}@${digest}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  ci-ok:
    if: always()
    needs: [lint, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
